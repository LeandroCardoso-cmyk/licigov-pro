name: Backup do Banco (agendado + manual)

# Backup lógico do MySQL de produção (mysqldump --single-transaction: snapshot consistente,
# somente leitura, sem travar tabelas). Executa:
#   - AGENDADO: todo dia às 06:00 UTC (03:00 BRT);
#   - MANUAL:  aba "Actions" → "Backup do Banco (agendado + manual)" → "Run workflow".
#
# Requer o secret BACKUP_DATABASE_URL (string de conexão MySQL PÚBLICA — ex.: o MYSQL_PUBLIC_URL
# do Railway de produção). O dump comprimido + o checksum SHA-256 ficam como ARTIFACT do run
# (Actions → run → Artifacts), com retenção de 14 dias. Nunca versiona o dump no Git.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diariamente
  workflow_dispatch:

# Evita dois backups simultâneos (agendado + manual disparados juntos).
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump completo (mysqldump) + checksum
    runs-on: ubuntu-latest
    steps:
      - name: Dump do banco + checksum
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "❌ Secret BACKUP_DATABASE_URL não definido (use o MYSQL_PUBLIC_URL do Railway)."
            exit 1
          fi
          # Parse de mysql://user:senha@host:porta/banco (senha pode conter caracteres especiais).
          proto_stripped="${DB_URL#mysql://}"
          creds="${proto_stripped%%@*}"
          rest="${proto_stripped#*@}"
          DB_USER="${creds%%:*}"
          DB_PASS="${creds#*:}"
          hostport="${rest%%/*}"
          DB_NAME="${rest#*/}"; DB_NAME="${DB_NAME%%\?*}"
          DB_HOST="${hostport%%:*}"
          DB_PORT="${hostport#*:}"

          # Não expõe host/usuário/senha nos logs (apenas o nome do banco, não sensível).
          echo "Iniciando backup do banco \"$DB_NAME\"…"
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          FILE="backup-${DB_NAME}-${STAMP}.sql.gz"

          MYSQL_PWD="$DB_PASS" mysqldump \
            --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
            --single-transaction --routines --triggers --events \
            --set-gtid-purged=OFF --no-tablespaces \
            "$DB_NAME" | gzip > "$FILE"

          # Falha explícita se o dump saiu vazio/curto (não gera evidência falsa de backup).
          BYTES=$(stat -c%s "$FILE")
          if [ "$BYTES" -lt 1024 ]; then
            echo "❌ Dump suspeito (apenas ${BYTES} bytes) — abortando."
            exit 1
          fi

          # Checksum SHA-256 para verificação de integridade na restauração.
          sha256sum "$FILE" > "${FILE}.sha256"

          echo "✅ Backup concluído: ${FILE} (${BYTES} bytes)."
          echo "   Checksum: $(cut -d' ' -f1 "${FILE}.sha256")"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publicar artifact (dump + checksum, retenção 14 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_FILE }}.sha256
          retention-days: 14
          if-no-files-found: error
