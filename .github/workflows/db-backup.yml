name: Backup do Banco (agendado + manual)

# Backup lógico do MySQL (mysqldump --single-transaction: snapshot consistente, somente leitura, sem travar
# tabelas). Executa:
#   - AGENDADO: todo dia às 06:00 UTC (03:00 BRT) — SEMPRE PRODUÇÃO;
#   - MANUAL:  aba "Actions" → "Backup do Banco (agendado + manual)" → "Run workflow" → escolher o ambiente.
#
# SEC-AUD-2026-10 — ambientes separados por NOME de secret (scripts/ops/select-db-target.sh; sem fallback):
#   produção: BACKUP_DATABASE_URL, BACKUP_ENCRYPTION_KEY, [BACKUP_DB_SSL_CA], RESTORE_TARGET_URL;
#   staging:  STAGING_BACKUP_DATABASE_URL, STAGING_BACKUP_ENCRYPTION_KEY, STAGING_BACKUP_DB_SSL_CA,
#             STAGING_RESTORE_TARGET_URL.
# Ensaiar em staging NUNCA exige trocar os secrets de produção. Usar contas só de backup
# (docs/security/incident-2026-10/ROTATION_RUNBOOK.md). O dump CIFRADO + checksum ficam como ARTIFACT do run
# (`db-backup-<ambiente>`), retenção de 14 dias. Nunca versiona o dump no Git.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC diariamente (produção)
  workflow_dispatch:
    inputs:
      target:
        description: "Ambiente do banco (staging usa só os secrets STAGING_*; sem fallback para produção)."
        type: choice
        required: true
        options:
          - staging
          - production
      run_restore_drill:
        description: "Após o backup, executar o DRILL de restauração no RESTORE_TARGET_URL do ambiente (dispatch-only). Destino: instância descartável, isolada, banco licigov_restore_drill*, VAZIO — nunca produção/staging."
        type: boolean
        default: false

# Um backup por ambiente por vez (agendado + manual de produção não rodam juntos).
concurrency:
  group: db-backup-${{ github.event_name == 'schedule' && 'production' || inputs.target }}
  cancel-in-progress: false

# SEC-AUD-2026-10 — menor privilégio: o GITHUB_TOKEN só lê o repositório (nenhum job escreve no GitHub).
permissions:
  contents: read

jobs:
  backup:
    name: Dump completo (mysqldump) cifrado + checksum
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.dump.outputs.target }}
    # O dump via proxy público leva ~20 min hoje (345 tabelas, latência alta); teto para não pendurar o runner.
    timeout-minutes: 60
    steps:
      - name: Checkout (script de backup versionado)
        uses: actions/checkout@v4

      # SEC-AUD-2026-10 — lógica em scripts/ops/db-backup.sh (testada com binários sintéticos em
      # server/__tests__/unit/db-backup-script.test.ts): falha ANTES de conectar sem BACKUP_DATABASE_URL ou
      # BACKUP_ENCRYPTION_KEY (não há mais modo sem cifra); TLS obrigatório (VERIFY_CA se
      # BACKUP_DB_SSL_CA estiver definido); dump nunca em claro no disco; qualquer falha deixa
      # backup-out/ vazio. Mesmo formato de cifra de antes (compatível com o drill e com a retenção).
      - name: Dump cifrado + checksum
        id: dump
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DB_TARGET_INPUT: ${{ inputs.target }}
          PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PRODUCTION_BACKUP_DB_SSL_CA: ${{ secrets.BACKUP_DB_SSL_CA }}
          STAGING_BACKUP_DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          STAGING_BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
          STAGING_BACKUP_DB_SSL_CA: ${{ secrets.STAGING_BACKUP_DB_SSL_CA }}
          BACKUP_OUT_DIR: backup-out
        run: |
          set -euo pipefail
          mkdir -p backup-out
          bash scripts/ops/select-db-target.sh backup -- bash scripts/ops/db-backup.sh

      # Só roda se o passo anterior teve sucesso (condição padrão do Actions); publica apenas o .enc e o checksum.
      - name: Publicar artifact cifrado (dump + checksum, retenção 14 dias)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.dump.outputs.target }}
          path: |
            backup-out/backup-${{ steps.dump.outputs.target }}-*.sql.gz.enc
            backup-out/backup-${{ steps.dump.outputs.target }}-*.sql.gz.enc.sha256
          retention-days: 14
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # DRILL de restauração REAL (dispatch-only, opt-in). Lógica em scripts/ops/db-restore-drill.sh, sempre
  # atrás de select-db-target.sh: mesmo ambiente do backup; destino = RESTORE_TARGET_URL do ambiente
  # (STAGING_RESTORE_TARGET_URL em staging), ≠ origem, ≠ banco do outro ambiente, banco nomeado
  # licigov_restore_drill*, acessível e VAZIO. Banco vazio sozinho NÃO prova que a instância é descartável:
  # a identificação, o acesso restrito e o descarte da instância são pré-requisitos do operador
  # (docs/security/incident-2026-10/CONTAINMENT_CHECKLIST.md). Dump decifrado só em stream; nada de
  # host/URL/secret/registro no log; o banco de destino NÃO é dropado pelo job.
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  restore-drill:
    name: Drill de restauração real (destino descartável)
    needs: backup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_restore_drill }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (script do drill versionado)
        uses: actions/checkout@v4

      - name: Baixar backup cifrado do mesmo ambiente
        uses: actions/download-artifact@v4
        with:
          name: db-backup-${{ needs.backup.outputs.target }}
          path: drill-in

      - name: Instalar mysql-client
        run: sudo apt-get update && sudo apt-get install -y mysql-client openssl

      - name: Drill — validar destino, restaurar e verificar (sem expor dados/secrets)
        working-directory: drill-in
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DB_TARGET_INPUT: ${{ inputs.target }}
          PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PRODUCTION_RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
          STAGING_BACKUP_DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          STAGING_BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
          STAGING_RESTORE_TARGET_URL: ${{ secrets.STAGING_RESTORE_TARGET_URL }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ops/select-db-target.sh" drill -- bash "$GITHUB_WORKSPACE/scripts/ops/db-restore-drill.sh"

      - name: Publicar evidência do drill (retenção 90 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-evidence-${{ needs.backup.outputs.target }}
          path: drill-in/restore-drill-evidence.md
          retention-days: 90
          if-no-files-found: warn
