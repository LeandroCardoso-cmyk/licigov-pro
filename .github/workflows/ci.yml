name: CI/CD - LiciGov Pro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Permite rodar os gates manualmente em qualquer branch (ex.: validar a PR D antes do merge,
  # quando o Actions em PR aguarda aprovação). O job `deploy` continua restrito à `main`.
  workflow_dispatch:

# Cancela runs antigos do mesmo ref quando um novo push chega (economia + feedback mais rápido).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node compatível com produção (Railway roda 20+ LTS; fixamos 22 aqui e em .nvmrc/engines).
  NODE_VERSION: "22"

jobs:
  # ── GATE OBRIGATÓRIO 1: o projeto compila (typecheck real) + lint de não-regressão ──
  quality:
    name: Typecheck + Lint (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para o diff de lint de não-regressão

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ativar pnpm (corepack — versão do packageManager)
        run: corepack enable

      - name: Instalar dependências (lockfile — reproduzível)
        run: pnpm install --frozen-lockfile

      # Typecheck REAL — falha o pipeline se houver erro de tipos (antes era um `echo` simbólico).
      - name: Typecheck (tsc --noEmit)
        run: pnpm check

      # Lint de NÃO-REGRESSÃO: a base tem dívida herdada (~357 erros/653 warnings de
      # no-unused-vars/no-explicit-any/no-console em scripts e testes). Em vez de mascarar com
      # `|| true` ou exigir uma faxina ampla fora de escopo, exigimos zero problema APENAS nos
      # arquivos .ts/.tsx alterados nesta mudança. O caminho para o gate completo está no runbook.
      - name: Lint (não-regressão — arquivos alterados)
        run: |
          set -euo pipefail
          TARGET="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=1 origin "$TARGET" || true
          CHANGED=$(git diff --diff-filter=ACMR --name-only "origin/$TARGET"...HEAD -- '*.ts' '*.tsx' 2>/dev/null | tr '\n' ' ' || true)
          if [ -z "${CHANGED// /}" ]; then
            echo "Nenhum arquivo .ts/.tsx alterado vs origin/$TARGET — lint de não-regressão OK."
            exit 0
          fi
          echo "Lintando (não-regressão): $CHANGED"
          pnpm exec eslint $CHANGED --max-warnings 0

  # ── GATE OBRIGATÓRIO 2: suíte de testes automatizados ──
  test:
    name: Testes Automatizados (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Executar suíte (vitest run)
        run: pnpm test
        env:
          CI: true

  # ── GATE OBRIGATÓRIO 3: smokes MySQL reais + ISOLAMENTO multi-tenant ──
  mysql-smoke:
    name: Smoke MySQL + Isolamento (gate)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: licigov
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/licigov
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile

      # Fase B — RELEASE STEP explícito: aplica a cadeia completa de migrations versionadas no banco
      # de smoke (sob advisory lock, via db:migrate:release), ANTES de qualquer smoke. Antes, o schema
      # do banco compartilhado era construído como EFEITO COLATERAL do reconciliador de runtime; agora
      # é um passo de release explícito — e este passo também prova, num MySQL 8 real, que o runner de
      # release e a migration de closure 0297 (com stored procedures) aplicam sem erro.
      - name: Release — aplicar migrations no banco de smoke (db:migrate:release)
        run: pnpm db:migrate:release

      # Fase B (RUNTIME & RELEASE SAFETY) — MIGRATION SAFETY. Prova a estratégia de migrations que
      # substituiu o reconciliador de runtime: CLEAN INSTALL (migrate-apenas fecha o schema.ts em
      # 0/0/0, sem mutação em runtime), UPGRADE (0000..0296 → 0297 converge e preserva dados), REPLAY
      # (0297 idempotente no banco convergido) e RENAME PRECONDITIONS (matriz de precondição). Usa
      # bancos dedicados (CREATE/DROP DATABASE) → roda cedo, sem depender de nem sujar os demais smokes.
      - name: Smoke — migration safety (clean install / upgrade / replay / rename preconditions)
        run: pnpm exec vitest run server/__tests__/integration/reconciliation-mysql-smoke.test.ts
      # P0 piloto (hardening) — governança FAIL-CLOSED da identidade institucional: migration 0302
      # aborta em ambiguidade (órfão/multi-org/conflito/nome/cnpj) ANTES de mutar, sem discard silencioso;
      # tenant-scope, unicidade por org e remoção da duplicidade nome/cnpj.
      - name: Smoke — governança FAIL-CLOSED de configurações institucionais (documentSettings)
        run: pnpm exec vitest run server/__tests__/integration/document-settings-governance-mysql-smoke.test.ts
      # Composição canônica (organizations + extensão) e REPLAY-SAFE temporal (snapshot congelado).
      - name: Smoke — identidade institucional composta + replay-safe
        run: pnpm exec vitest run server/__tests__/integration/institutional-identity-replay-mysql-smoke.test.ts
      - name: Smoke — persistência da consulta (regressão de DATETIME)
        run: pnpm exec vitest run server/__tests__/integration/consultation-mysql-smoke.test.ts
      - name: Smoke — criação canônica de Processo Licitatório (regressão de DATETIME)
        run: pnpm exec vitest run server/__tests__/integration/procurement-create-mysql-smoke.test.ts

      # PR D — concorrência/rollback do versionamento (transação + SELECT ... FOR UPDATE).
      - name: Smoke — concorrência e rollback do versionamento (DATA-012)
        run: pnpm exec vitest run server/__tests__/integration/document-version-concurrency-mysql-smoke.test.ts

      # F2 (homologação V1) — transição de Item concorrência-segura (compare-and-set atômico).
      - name: Smoke — transição de Item concorrência-segura (F2 CAS)
        run: pnpm exec vitest run server/__tests__/integration/item-transition-concurrency-mysql-smoke.test.ts

      # ISOLAMENTO multi-tenant / RBAC — G7 exige que o isolamento não regrida no gate de CI.
      - name: Smoke — isolamento multi-tenant / RBAC (test:smoke:security)
        run: pnpm test:smoke:security

      # PR B.2.2 — vínculo da sessão ao processo canônico (ownership, retomada e dedup por processo).
      # Roda ANTES da reconciliação da 0288: exige import_sessions no formato canônico COMPLETO
      # (a reconciliação abaixo recria a tabela em formatos mínimos/parciais para exercitar o drift,
      # e o migrator não a reconstrói no mesmo banco pois as migrations já constam de __drizzle_migrations).
      - name: Smoke — ingestão × processo canônico (B.2.2)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-process-binding-mysql-smoke.test.ts

      # PR B.2.2 — correção humana auditável (imutabilidade do raw, histórico, optimistic lock, idempotência).
      - name: Smoke — correção humana auditável (B.2.2)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-correction-mysql-smoke.test.ts

      # PR B.2.4 — promoção transacional ao domínio (idempotência, lineage, rollback, isolamento). Também
      # exige import_sessions/import_staging_items no formato canônico completo → antes da reconciliação da 0288.
      - name: Smoke — promoção transacional ao domínio (B.2.4)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-promotion-mysql-smoke.test.ts

      # P0 PILOTO — fundação Document Intake + Pesquisa → Itens Inteligentes → TR → Edital: worker real +
      # parsers reais (DOCX/PDF/CSV gerados), revisão/aprovação/promoção documental governada (conflito +
      # substituição), OCR_REQUIRED, isolamento, mapa comparativo → Itens (média/replay/duplicidade),
      # TR com contexto real + quadro autoritativo + SOURCE_CHANGED, golden A e B. Também exige
      # import_sessions no formato canônico completo → antes da reconciliação da 0288.
      - name: Smoke — P0 piloto (document intake + pesquisa → itens → TR → Edital)
        run: pnpm exec vitest run server/__tests__/integration/p0-pilot-foundation-mysql-smoke.test.ts

      # P0 PILOTO — hardening bloqueante: contrato monetário XLSX (NUMBER × TEXT), versionamento de cotação
      # por contentHash, convergência de Itens (pendente atualiza / decidido → SOURCE_CHANGED), reconciliação
      # legado→v2 fail-closed, dedup concorrente no BANCO (duas conexões reais), ledger documental append-only,
      # digest do snapshot canônico consumido, contrato de idempotência do createSession, recuperação
      # durável do enriquecimento, contagem de cotações válidas, cobertura documental e SoD do issueProcess.
      # Goldens A–D. Também exige import_sessions canônico → antes da reconciliação da 0288.
      - name: Smoke — P0 piloto hardening (dinheiro/cotações/itens/dedup/ledger/digest/idempotência)
        run: pnpm exec vitest run server/__tests__/integration/p0-pilot-hardening-mysql-smoke.test.ts

      # U2A / U2A-OCR — Pesquisa de Preços com PDF DIGITALIZADO: worker real + OCR LOCAL real (tesseract.js +
      # português empacotado, offline, sem credencial) → MESMO parser tabular → staging → revisão → promoção.
      # Zero itens ⇒ não aprovável/promovível; OCR_REQUIRED/OCR_FAILED + retry na mesma sessão (checksum nunca
      # bloqueado); reextração nunca sobrescreve revisão; promoção sem duplicidade; isolamento multi-tenant.
      - name: Smoke — U2A-OCR (PDF digitalizado → OCR governado → staging → promoção)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-ocr-mysql-smoke.test.ts

      # Layout v2 — PDF DIGITAL layout-aware (Golden E sanitizado: 5 itens / 30 cotações, OCR não roda) e
      # REPROCESSAMENTO SEGURO: mesma sessão, troca atômica do staging não revisado, auditoria, FORBIDDEN com
      # qualquer decisão humana, RBAC, isolamento multi-tenant, reservas concorrentes, rollback e sem duplicar.
      # Exige import_sessions canônico → antes da reconciliação da 0288.
      - name: Smoke — Layout v2 (PDF layout-aware + reprocessamento seguro)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-reextraction-mysql-smoke.test.ts

      # Pesquisa de Preços — revisão por ITEM LÓGICO: 30 cotações ⇒ 5 itens (projeção de leitura); decisão por
      # item atômica (só pendentes, CAS + revisão otimista + locks), auditoria de cada cotação, concorrência,
      # injeção entre itens/tenants bloqueada, RBAC e promoção ⇒ 5 Itens Inteligentes (não 30).
      - name: Smoke — revisão por item lógico (Pesquisa de Preços)
        run: pnpm exec vitest run server/__tests__/integration/price-research-review-mysql-smoke.test.ts

      # PR C — idempotência canônica concorrência-safe (replay/conflito/em-andamento/falha/concorrência).
      - name: Smoke — idempotência canônica (PR C)
        run: pnpm exec vitest run server/__tests__/integration/prc-idempotency-mysql-smoke.test.ts

      # C.4A — geração documental canônica replay-safe em MODO ESTRITO: commit atômico
      # (generated + official + timeline + evento + idempotency COMPLETED numa única transação),
      # rollback total em falha (após generated / após official), concorrência, replay e multi-tenant.
      - name: Smoke — geração canônica replay-safe estrito (C.4A)
        run: pnpm exec vitest run server/__tests__/integration/c4a-replay-safe-generation-mysql-smoke.test.ts

      # A2 — autoria estruturada × proveniência A1: cognição real → proveniência com evidenceFingerprint
      # REAL + grounding factual + artefato vinculado; structured output inválido → fail-closed + failed.
      - name: Smoke — autoria estruturada × proveniência A1 (A2)
        run: pnpm exec vitest run server/__tests__/integration/a2-authoring-provenance-mysql-smoke.test.ts

      # C.4B.1 — EMISSÃO OFICIAL governada em MODO ESTRITO: SoD (autor não emite), ator humano,
      # promoção válida (1 versão emitida + ledger), replay/CONFLICT, concorrência (uma emissão),
      # imutabilidade após edição do rascunho, nova versão após alteração, isolamento multi-tenant,
      # gate de export (rejeita 'gerado'), DFD fora do escopo.
      - name: Smoke — emissão oficial governada estrito (C.4B.1)
        run: pnpm exec vitest run server/__tests__/integration/c4b1-official-promotion-mysql-smoke.test.ts

      # C.4B.2 — LEITURA CANÔNICA reload-safe do rascunho revisável (reviewableDraft): conteúdo
      # persistido lido byte-a-byte + hash = draftContentHash (mesma primitive da emissão), vínculo
      # conteúdo↔hash = expectedContentHash da promoção, rascunho ausente → null, isolamento multi-tenant.
      - name: Smoke — leitura canônica do rascunho revisável estrito (C.4B.2)
        run: pnpm exec vitest run server/__tests__/integration/c4b2-reviewable-draft-mysql-smoke.test.ts

      # C.4B.3A — FUNDAÇÃO DE PROVENIÊNCIA do rascunho + SoD estendida em MODO ESTRITO: originador estável
      # (author preservado em regeneração/edição), último ator substantivo, ledger append-only com
      # previous_content, concorrência otimista sob lock (CONFLICT), idempotência do save, SoD de 3 atores
      # (originador e último editor não emitem), author NULL histórico permanece NULL, isolamento tenant.
      - name: Smoke — proveniência do rascunho + SoD estendida estrito (C.4B.3A)
        run: pnpm exec vitest run server/__tests__/integration/c4b3a-draft-provenance-mysql-smoke.test.ts

      # C.4B.3B — EDIÇÃO HUMANA GOVERNADA de ETP/TR/Edital em MODO ESTRITO: originador preservado, editor
      # = último ator substantivo, ledger human_edit (previous_content + hashes + correlações), no-op,
      # concorrência otimista (CONFLICT), idempotência (replay/CONFLICT), SoD de 3 atores, author NULL
      # permanece NULL, isolamento multi-tenant.
      - name: Smoke — edição humana governada estrito (C.4B.3B)
        run: pnpm exec vitest run server/__tests__/integration/c4b3b-governed-human-editing-mysql-smoke.test.ts

      # Contexto Canônico da Contratação × DFD — fluxo integrado pelo ROUTER real + AIExecutionEngine real:
      # criar Processo (fato na mesma transação) → contexto → DFD pré-preenchido → editar/salvar (fatos dfd)
      # → reload estável → contexto muda → DESATUALIZADO → reconciliação explícita → rascunho de IA
      # (proveniência, replay sem nova execução) → DFD aprovado intocável; RBAC; tenant; 0305 replay-safe.
      - name: Smoke — Contexto Canônico × DFD (prefill, stale, reconcile, IA supervisionada)
        run: pnpm exec vitest run server/__tests__/integration/canonical-context-dfd-mysql-smoke.test.ts

      # Itens da Contratação (0306) — router real: processo iniciado na Pesquisa → candidatos determinísticos →
      # 5 Itens Canônicos (não 30) → replay/CONFLICT → item manual (Pesquisa intacta) → quantidade prevista
      # (informar/"Usar N", concorrência por revision) → lotes (mover mantém id) → preço POR item → DFD → stale →
      # reconciliar → DFD aprovado ⇒ GOVERNED_CHANGE_REQUIRED → tenant/RBAC → 0306 replay-safe.
      - name: Smoke — Itens da Contratação + Lotes (candidatos, quantidade prevista, governança)
        run: pnpm exec vitest run server/__tests__/integration/procurement-items-mysql-smoke.test.ts

      # P0 final — TR consome a quantidade PREVISTA dos Itens da contratação (fonte = 1, prevista = 50 ⇒ TR 50 ×
      # preço) → PLANNED_QUANTITY_REQUIRED / PRICE_RESEARCH_ITEM_UNLINKED fail-closed → replay/CONFLICT pela
      # quantidade → TR oficial ⇒ GOVERNED_CHANGE_REQUIRED → processo legado preservado → tenant.
      - name: Smoke — TR × quantidade prevista (Itens da contratação)
        run: pnpm exec vitest run server/__tests__/integration/tr-canonical-quantity-mysql-smoke.test.ts

      # PR C.2B — revisão/aprovação documental version-aware (SoD, idempotência, multi-tenant).
      - name: Smoke — revisão/aprovação documental version-aware (PR C.2B)
        run: pnpm exec vitest run server/__tests__/integration/document-review-mysql-smoke.test.ts

      # PR C.3A — shadow da Contratação Direta (flag ON/OFF, observabilidade, replay, multi-tenant).
      - name: Smoke — shadow Contratação Direta (PR C.3A)
        run: pnpm exec vitest run server/__tests__/integration/direct-contract-shadow-mysql-smoke.test.ts

      # C.3A-OPS — controle institucional de feature flags (read/write, auditoria atômica, replay,
      # conflito, cache, multi-tenant, guarda de org).
      - name: Smoke — controle de feature flags (C.3A-OPS)
        run: pnpm exec vitest run server/__tests__/integration/feature-flag-admin-mysql-smoke.test.ts

      # C.3A-OPS.2 — reconciliação de activity_logs.processId (drift db:push baseline-stampado):
      # banco novo/legado/reconciliado, preservação de dados, INSERT de auditoria org-level, idempotência.
      - name: Smoke — reconciliação de activity_logs (C.3A-OPS.2)
        run: pnpm exec vitest run server/__tests__/integration/activity-logs-reconciliation-mysql-smoke.test.ts

      # C.3A-OPS.3 — DATETIME da Contratação Direta em MODO ESTRITO (ISO T/Z → DATETIME(3)):
      # controle prova a rejeição do ISO cru; writer real corrigido persiste + round-trip + upsert + irmão.
      - name: Smoke — DATETIME Contratação Direta estrito (C.3A-OPS.3)
        run: pnpm exec vitest run server/__tests__/integration/direct-procurement-datetime-mysql-smoke.test.ts

      # PR B.2.1 — reconciliação da migration 0288 (banco novo/transitório/parcial, tipo incompatível,
      # índice, linhas históricas, journal único, isolamento). Roda por ÚLTIMO: recria import_sessions
      # em formatos mínimos/parciais para exercitar o drift e nenhum step depende dessa tabela depois.
      - name: Smoke — reconciliação da 0288 (campos canônicos de ingestão)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-0288-reconciliation-mysql-smoke.test.ts

      # V1 — Functional Closure: Parecer assinado→emitido (conteúdo exato + gate de policy), Contratação
      # Direta (justificativa de preço + ratificação real projetadas), Contrato/Aditivo materializados e
      # liberados para export. Prova também a correção do DATETIME estrito em legal_opinion/contract writers.
      - name: Smoke — V1 Functional Closure (Parecer/Direta/Contrato estrito)
        run: pnpm exec vitest run server/__tests__/integration/v1-functional-closure-mysql-smoke.test.ts

      # B1 (2ª passagem V1) — Institutional Request Engine em MODO ESTRITO: fluxo real Contratação
      # Direta → Solicitar Parecer Jurídico. Prova round-trip createdAt/updatedAt, assignment, timeline,
      # response, signedAt, notificação/referência documental, updateStatus e isolamento multi-tenant,
      # sem "Incorrect datetime value" (ISO cru em datetime(3) corrigido na fronteira de persistência).
      - name: Smoke — Institutional Request Engine estrito (B1 Contratação Direta → Parecer)
        run: pnpm exec vitest run server/__tests__/integration/institutional-request-engine-mysql-smoke.test.ts

      # Aditivos KPI (2ª passagem V1) — Central conta aditivos REAIS por tenant (fonte canônica
      # contract_addenda via countContractAddendaByOrg): 0 sem aditivo, contagem correta com múltiplos,
      # tenant B não altera tenant A, refresh determinístico.
      - name: Smoke — KPI de aditivos da Central por tenant (Aditivos KPI)
        run: pnpm exec vitest run server/__tests__/integration/dashboard-addenda-kpi-mysql-smoke.test.ts

      # V1 — SNAPSHOT imutável de assinatura na materialização do Parecer emitido: signerName
      # (users), signerRole (organization_members), método e signedAt gravados no metadata na
      # emissão; conteúdo jurídico intacto (assinatura é metadado/representação, não conteúdo);
      # re-leitura preserva identidade histórica; isolamento multi-tenant do documento oficial.
      - name: Smoke — snapshot de assinatura do Parecer (metadata emitido)
        run: pnpm exec vitest run server/__tests__/integration/legal-opinion-signature-snapshot-mysql-smoke.test.ts

      # A3-RD1 — domínio GOVERNADO de referência jurídica (Lei 14.133/2021) contra MySQL real:
      # installer replay-safe (INSERT/no-op/fail-closed por hash), readiness fail-closed, resolução
      # temporal exatamente-um e aprovação/ativação auditada (instalar ≠ ativar).
      - name: Smoke — reference set governado (A3-RD1)
        run: pnpm exec vitest run server/__tests__/integration/legal-reference-governance-mysql-smoke.test.ts

      # A3-RD1 — BRIDGE governada em direct_contracts (migration 0300): registro GOVERNADO
      # (legalReferenceEntryId, legalArticleId NULL) × registro LEGADO (legalArticleId, governed NULL);
      # domínios de identidade separados persistem corretamente contra MySQL real.
      - name: Smoke — bridge governada em direct_contracts (A3-RD1)
        run: pnpm exec vitest run server/__tests__/integration/direct-contract-governed-bridge-mysql-smoke.test.ts

      # DATA-039 (Bloco D) — atomicidade de operações compostas do fluxo canônico contra MySQL real:
      # createProcessWithInitialEvent (processo + evento inicial átomo) e insertResearchWithItems
      # (cabeçalho + itens átomo), com prova de ROLLBACK real (transação que lança não deixa parcial).
      - name: Smoke — atomicidade de operações compostas (DATA-039)
        run: pnpm exec vitest run server/__tests__/integration/data039-atomicity-mysql-smoke.test.ts

  # ── GATE OBRIGATÓRIO 4: build de produção real (vite build + esbuild) ──
  build:
    name: Build de Produção (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      # Build REAL — antes era `echo "✅ Build verificado"`. Agora compila de fato e falha se quebrar.
      - name: Build (vite build + esbuild do server)
        run: pnpm build
      - name: Publicar artefato de build validado
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ── GATE OBRIGATÓRIO 5: auditoria de dependências com BASELINE (bloqueia REGRESSÃO) ──
  # A dívida PRÉ-EXISTENTE (críticas/altas em deps transitivas) está registrada em
  # security/audit-baseline.json e NÃO bloqueia. Mas qualquer NOVA vulnerabilidade high/critical
  # fora do baseline FALHA o pipeline (sem `|| true`, sem regressão silenciosa). O relatório
  # completo fica visível. Reduzir o baseline = OPERATOR_ACTION_REQUIRED (SEC).
  security-audit:
    name: Auditoria de Dependências (gate de não-regressão)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      # Gate: imprime o resumo high/critical e FALHA apenas em NOVA vulnerabilidade fora do
      # baseline (sem `|| true`, sem mascarar). A dívida pré-existente é auditável no baseline.
      - name: Gate de auditoria (não-regressão)
        run: pnpm audit:gate

  # ── DEPLOY (preparação): SÓ avança se TODOS os gates obrigatórios passarem ──
  deploy:
    name: Deploy (Preparação)
    runs-on: ubuntu-latest
    needs: [quality, test, mysql-smoke, build, security-audit]   # todos os gates obrigatórios
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Baixar artefato de build validado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Confirmar artefato de build
        run: |
          set -euo pipefail
          test -f dist/index.js || { echo "❌ Artefato de build ausente (dist/index.js)."; exit 1; }
          echo "✅ Build validado presente. Gates obrigatórios (typecheck, lint, testes, smokes de isolamento, build) aprovados."
          echo "ℹ️ O deploy efetivo é feito pela plataforma (Railway) — este job apenas comprova a prontidão."
