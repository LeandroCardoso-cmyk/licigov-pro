name: CI/CD - LiciGov Pro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Permite rodar os gates manualmente em qualquer branch (ex.: validar a PR D antes do merge,
  # quando o Actions em PR aguarda aprovação). O job `deploy` continua restrito à `main`.
  workflow_dispatch:

# Cancela runs antigos do mesmo ref quando um novo push chega (economia + feedback mais rápido).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node compatível com produção (Railway roda 20+ LTS; fixamos 22 aqui e em .nvmrc/engines).
  NODE_VERSION: "22"

jobs:
  # ── GATE OBRIGATÓRIO 1: o projeto compila (typecheck real) + lint de não-regressão ──
  quality:
    name: Typecheck + Lint (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para o diff de lint de não-regressão

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ativar pnpm (corepack — versão do packageManager)
        run: corepack enable

      - name: Instalar dependências (lockfile — reproduzível)
        run: pnpm install --frozen-lockfile

      # Typecheck REAL — falha o pipeline se houver erro de tipos (antes era um `echo` simbólico).
      - name: Typecheck (tsc --noEmit)
        run: pnpm check

      # Lint de NÃO-REGRESSÃO: a base tem dívida herdada (~357 erros/653 warnings de
      # no-unused-vars/no-explicit-any/no-console em scripts e testes). Em vez de mascarar com
      # `|| true` ou exigir uma faxina ampla fora de escopo, exigimos zero problema APENAS nos
      # arquivos .ts/.tsx alterados nesta mudança. O caminho para o gate completo está no runbook.
      - name: Lint (não-regressão — arquivos alterados)
        run: |
          set -euo pipefail
          TARGET="${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=1 origin "$TARGET" || true
          CHANGED=$(git diff --diff-filter=ACMR --name-only "origin/$TARGET"...HEAD -- '*.ts' '*.tsx' 2>/dev/null | tr '\n' ' ' || true)
          if [ -z "${CHANGED// /}" ]; then
            echo "Nenhum arquivo .ts/.tsx alterado vs origin/$TARGET — lint de não-regressão OK."
            exit 0
          fi
          echo "Lintando (não-regressão): $CHANGED"
          pnpm exec eslint $CHANGED --max-warnings 0

  # ── GATE OBRIGATÓRIO 2: suíte de testes automatizados ──
  test:
    name: Testes Automatizados (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      - name: Executar suíte (vitest run)
        run: pnpm test
        env:
          CI: true

  # ── GATE OBRIGATÓRIO 3: smokes MySQL reais + ISOLAMENTO multi-tenant ──
  mysql-smoke:
    name: Smoke MySQL + Isolamento (gate)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: licigov
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/licigov
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile

      # A ordem importa: a reconciliação roda PRIMEIRO (aplica a cadeia completa de migrations
      # num banco zerado — cenário staging — e depois reproduz o drift da produção e o corrige).
      - name: Smoke — reconciliação de schema (migrations + ensureSchema)
        run: pnpm exec vitest run server/__tests__/integration/reconciliation-mysql-smoke.test.ts
      - name: Smoke — persistência da consulta (regressão de DATETIME)
        run: pnpm exec vitest run server/__tests__/integration/consultation-mysql-smoke.test.ts
      - name: Smoke — criação canônica de Processo Licitatório (regressão de DATETIME)
        run: pnpm exec vitest run server/__tests__/integration/procurement-create-mysql-smoke.test.ts

      # PR D — concorrência/rollback do versionamento (transação + SELECT ... FOR UPDATE).
      - name: Smoke — concorrência e rollback do versionamento (DATA-012)
        run: pnpm exec vitest run server/__tests__/integration/document-version-concurrency-mysql-smoke.test.ts

      # ISOLAMENTO multi-tenant / RBAC — G7 exige que o isolamento não regrida no gate de CI.
      - name: Smoke — isolamento multi-tenant / RBAC (test:smoke:security)
        run: pnpm test:smoke:security

      # PR B.2.2 — vínculo da sessão ao processo canônico (ownership, retomada e dedup por processo).
      # Roda ANTES da reconciliação da 0288: exige import_sessions no formato canônico COMPLETO
      # (a reconciliação abaixo recria a tabela em formatos mínimos/parciais para exercitar o drift,
      # e o migrator não a reconstrói no mesmo banco pois as migrations já constam de __drizzle_migrations).
      - name: Smoke — ingestão × processo canônico (B.2.2)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-process-binding-mysql-smoke.test.ts

      # PR B.2.2 — correção humana auditável (imutabilidade do raw, histórico, optimistic lock, idempotência).
      - name: Smoke — correção humana auditável (B.2.2)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-correction-mysql-smoke.test.ts

      # PR B.2.4 — promoção transacional ao domínio (idempotência, lineage, rollback, isolamento). Também
      # exige import_sessions/import_staging_items no formato canônico completo → antes da reconciliação da 0288.
      - name: Smoke — promoção transacional ao domínio (B.2.4)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-promotion-mysql-smoke.test.ts

      # PR C — idempotência canônica concorrência-safe (replay/conflito/em-andamento/falha/concorrência).
      - name: Smoke — idempotência canônica (PR C)
        run: pnpm exec vitest run server/__tests__/integration/prc-idempotency-mysql-smoke.test.ts

      # PR C.2B — revisão/aprovação documental version-aware (SoD, idempotência, multi-tenant).
      - name: Smoke — revisão/aprovação documental version-aware (PR C.2B)
        run: pnpm exec vitest run server/__tests__/integration/document-review-mysql-smoke.test.ts

      # PR C.3A — shadow da Contratação Direta (flag ON/OFF, observabilidade, replay, multi-tenant).
      - name: Smoke — shadow Contratação Direta (PR C.3A)
        run: pnpm exec vitest run server/__tests__/integration/direct-contract-shadow-mysql-smoke.test.ts

      # C.3A-OPS — controle institucional de feature flags (read/write, auditoria atômica, replay,
      # conflito, cache, multi-tenant, guarda de org).
      - name: Smoke — controle de feature flags (C.3A-OPS)
        run: pnpm exec vitest run server/__tests__/integration/feature-flag-admin-mysql-smoke.test.ts

      # PR B.2.1 — reconciliação da migration 0288 (banco novo/transitório/parcial, tipo incompatível,
      # índice, linhas históricas, journal único, isolamento). Roda por ÚLTIMO: recria import_sessions
      # em formatos mínimos/parciais para exercitar o drift e nenhum step depende dessa tabela depois.
      - name: Smoke — reconciliação da 0288 (campos canônicos de ingestão)
        run: pnpm exec vitest run server/__tests__/integration/ingestion-0288-reconciliation-mysql-smoke.test.ts

  # ── GATE OBRIGATÓRIO 4: build de produção real (vite build + esbuild) ──
  build:
    name: Build de Produção (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      # Build REAL — antes era `echo "✅ Build verificado"`. Agora compila de fato e falha se quebrar.
      - name: Build (vite build + esbuild do server)
        run: pnpm build
      - name: Publicar artefato de build validado
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ── GATE OBRIGATÓRIO 5: auditoria de dependências com BASELINE (bloqueia REGRESSÃO) ──
  # A dívida PRÉ-EXISTENTE (críticas/altas em deps transitivas) está registrada em
  # security/audit-baseline.json e NÃO bloqueia. Mas qualquer NOVA vulnerabilidade high/critical
  # fora do baseline FALHA o pipeline (sem `|| true`, sem regressão silenciosa). O relatório
  # completo fica visível. Reduzir o baseline = OPERATOR_ACTION_REQUIRED (SEC).
  security-audit:
    name: Auditoria de Dependências (gate de não-regressão)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Ativar pnpm (corepack)
        run: corepack enable
      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile
      # Gate: imprime o resumo high/critical e FALHA apenas em NOVA vulnerabilidade fora do
      # baseline (sem `|| true`, sem mascarar). A dívida pré-existente é auditável no baseline.
      - name: Gate de auditoria (não-regressão)
        run: pnpm audit:gate

  # ── DEPLOY (preparação): SÓ avança se TODOS os gates obrigatórios passarem ──
  deploy:
    name: Deploy (Preparação)
    runs-on: ubuntu-latest
    needs: [quality, test, mysql-smoke, build, security-audit]   # todos os gates obrigatórios
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Baixar artefato de build validado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Confirmar artefato de build
        run: |
          set -euo pipefail
          test -f dist/index.js || { echo "❌ Artefato de build ausente (dist/index.js)."; exit 1; }
          echo "✅ Build validado presente. Gates obrigatórios (typecheck, lint, testes, smokes de isolamento, build) aprovados."
          echo "ℹ️ O deploy efetivo é feito pela plataforma (Railway) — este job apenas comprova a prontidão."
