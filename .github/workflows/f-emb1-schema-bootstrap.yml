name: F-EMB1 Schema Bootstrap (temporary)

on:
  push:
    branches:
      - feat/f-emb1-embedding-lineage

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/f-emb1-embedding-lineage
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch canonical schema
        run: node scripts/f-emb1-bootstrap-schema.mjs --prepare

      - name: Generate Drizzle journal and snapshot
        run: pnpm exec drizzle-kit generate --name=f_emb1_embedding_lineage

      - name: Finalize rollout-safe migration
        shell: bash
        run: |
          export F_EMB1_CHANGED_FILES="$(git status --porcelain | sed -E 's/^.. //')"
          node scripts/f-emb1-bootstrap-schema.mjs --finalize

      - name: Verify generated scope
        shell: bash
        run: |
          git status --short
          test -f drizzle/0301_f_emb1_embedding_lineage.sql
          git diff --check

      - name: Commit generated schema artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts drizzle/0301_f_emb1_embedding_lineage.sql drizzle/meta/_journal.json drizzle/meta/0301_snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(f-emb1): add embedding lineage schema migration"
          git push origin HEAD:feat/f-emb1-embedding-lineage
