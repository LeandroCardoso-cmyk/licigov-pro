name: Listar modelos de IA (manual)

# Rodar pelo GitHub: aba "Actions" → "Listar modelos de IA (manual)" → "Run workflow".
# Requer o secret GEMINI_API_KEY (a mesma chave usada em produção). Mostra quais modelos a conta
# suporta, para definir AI_MODEL no Railway.
on:
  workflow_dispatch:

# Token do GitHub só com leitura do repositório (o job não escreve nada no GitHub).
permissions:
  contents: read

jobs:
  models:
    name: Modelos disponíveis (Gemini)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SEC-AUD-2026-10 — job recebe segredo de produção: pnpm pela versão fixada (corepack/packageManager)
      # e instalação reprodutível pelo lockfile (sem resolver versões novas com o segredo no ambiente).
      - name: Ativar pnpm (corepack — versão do packageManager)
        run: corepack enable

      - name: Instalar dependências (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Listar modelos (o resultado aparece neste log)
        run: pnpm ai:models || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
