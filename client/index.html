<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/logo-original-transparent.png" />
    <link rel="apple-touch-icon" href="/logo-original-transparent.png" />
    <title>LiciGov Pro</title>

    <!-- Tema institucional: aplica claro/escuro ANTES do React montar (sem flash / FOUC).
         SEC-036 — externalizado para /theme-init.js (servido a partir de 'self') para respeitar
         a CSP `script-src 'self'` sem `unsafe-inline`. Bloqueante no <head> → roda antes do paint. -->
    <script src="/theme-init.js"></script>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Sistema SaaS completo para automação de processos licitatórios no Brasil. Geração inteligente de documentos, gestão de contratos, contratação direta e conformidade com Lei 14.133/2021." />
    <meta name="keywords" content="licitação, pregão eletrônico, lei 14.133, gestão de contratos, contratação direta, sistema de licitações, órgão público, compras públicas" />
    
    <!-- Open Graph Meta Tags (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LiciGov Pro" />
    <meta property="og:title" content="LiciGov Pro - Sistema SaaS para Gestão de Licitações Públicas" />
    <meta property="og:description" content="Automatize processos licitatórios com IA. Geração de documentos, gestão de contratos, contratação direta e conformidade com Lei 14.133/2021. Solução completa para órgãos públicos." />
    <meta property="og:url" content="https://licigovpro.com.br" />
    <meta property="og:image" content="https://licigovpro.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LiciGov Pro - Sistema de Gestão de Licitações" />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LiciGov Pro - Sistema SaaS para Gestão de Licitações Públicas" />
    <meta name="twitter:description" content="Automatize processos licitatórios com IA. Geração de documentos, gestão de contratos, contratação direta e conformidade com Lei 14.133/2021." />
    <meta name="twitter:image" content="https://licigovpro.com.br/og-image.png" />
    <meta name="twitter:image:alt" content="LiciGov Pro - Sistema de Gestão de Licitações" />
    
    <!-- SEC-036 — Google Analytics GA4 NÃO é mais injetado inline no shell (violava
         `script-src 'self'` e carregava em TODA rota, inclusive login/app autenticado e staging).
         Agora é carregado em runtime por client/src/lib/analytics.ts, condicionado a
         VITE_GA_MEASUREMENT_ID — assim fica desligado em staging/dev (variável ausente) e a CSP
         só libera os domínios do Google quando a analítica é habilitada. -->
    <!-- Add Google Fonts here, example:
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
